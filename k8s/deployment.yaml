apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmind
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docmind
  template:
    metadata:
      labels:
        app: docmind
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: docmind
          image: docmind:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: docmind-config
            - secretRef:
                name: docmind-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: index-data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: index-data
          persistentVolumeClaim:
            claimName: docmind-index
        - name: tmp
          emptyDir: {}
